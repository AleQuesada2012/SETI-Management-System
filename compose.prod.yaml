# Production stack for the single AWS VM (ADR-0012 and ADR-0007, both as amended). The database is the course's
# Amazon RDS PostgreSQL instance, not a container: DB_HOST in .env is its endpoint. Step-by-step guide, from a fresh
# EC2 instance to the first sign-in, backups included: docs/deployment.md. In short, on the VM:
#
#   cp .env.production.example .env        # fill in every value
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml exec app php artisan db:seed --force   # catalogs, roles, permissions
#   docker compose -f compose.prod.yaml exec app php artisan users:create-first-superuser <email> "<name>"
#
# The first Superusuario gets an invitation by email and sets up two-factor authentication at first sign-in; they
# should keep the recovery codes safe, since nobody else can reset theirs.
#
# Only Caddy publishes ports (80/443, automatic HTTPS). Uploaded files and exported reports live in the `storage`
# volume on the VM disk; back it up with the database (RDS keeps the database's own automated backups).
#
# A copy of this stack without RDS (to try a change behind HTTPS on a laptop) adds a PostgreSQL container with
# `--profile local-db` and DB_HOST=pgsql in its .env.

name: seti-prod

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
    args:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
      VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
  image: seti-app:prod
  env_file: .env
  environment:
    PHP_DATE_TIMEZONE: America/Costa_Rica
    PHP_UPLOAD_MAX_FILE_SIZE: 20M
    PHP_POST_MAX_SIZE: 205M
    NGINX_CLIENT_MAX_BODY_SIZE: 205M
    HEALTHCHECK_PATH: /up
    # Only the `app` service runs migrations and caches on start.
    AUTORUN_ENABLED: "false"
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    pgsql:
      condition: service_healthy
      # Only with --profile local-db; in production the database is RDS.
      required: false
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      PHP_DATE_TIMEZONE: America/Costa_Rica
      PHP_UPLOAD_MAX_FILE_SIZE: 20M
      PHP_POST_MAX_SIZE: 205M
      NGINX_CLIENT_MAX_BODY_SIZE: 205M
      HEALTHCHECK_PATH: /up
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  reverb:
    <<: *app
    command: ["php", "/var/www/html/artisan", "reverb:start", "--host=0.0.0.0", "--port=8000"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-reverb"]
      start_period: 10s

  caddy:
    image: caddy:2.11-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Only for copies of this stack (`--profile local-db`); production uses RDS.
  pgsql:
    image: postgres:18.6-trixie
    profiles: [local-db]
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-CR"
    # Reachable only from the machine itself: never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  storage:
  pgsql-data:
  caddy-data:
  caddy-config:
