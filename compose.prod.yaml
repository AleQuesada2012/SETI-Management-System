# Production stack for the single AWS VM (ADR-0012, ADR-0007 as amended). Run it on the VM with:
#
#   cp .env.production.example .env        # fill in every value
#   docker compose -f compose.prod.yaml up -d --build
#
# Only Caddy publishes ports (80/443, automatic HTTPS). The app, workers and PostgreSQL talk on the private
# `seti` network. Uploaded files and exported reports live in the `storage` volume on the VM disk; back up
# that volume and the `pgsql-data` volume.

name: seti-prod

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
    args:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
      VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
  image: seti-app:prod
  env_file: .env
  environment:
    PHP_DATE_TIMEZONE: America/Costa_Rica
    PHP_UPLOAD_MAX_FILE_SIZE: 20M
    PHP_POST_MAX_SIZE: 25M
    NGINX_CLIENT_MAX_BODY_SIZE: 25M
    HEALTHCHECK_PATH: /up
    # Only the `app` service runs migrations and caches on start.
    AUTORUN_ENABLED: "false"
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    pgsql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      PHP_DATE_TIMEZONE: America/Costa_Rica
      PHP_UPLOAD_MAX_FILE_SIZE: 20M
      PHP_POST_MAX_SIZE: 25M
      NGINX_CLIENT_MAX_BODY_SIZE: 25M
      HEALTHCHECK_PATH: /up
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  reverb:
    <<: *app
    command: ["php", "/var/www/html/artisan", "reverb:start", "--host=0.0.0.0", "--port=8000"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-reverb"]
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  pgsql:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-CR"
    # Reachable only from the VM itself (PowerBI gateway, backups over SSH): never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  storage:
  pgsql-data:
  caddy-data:
  caddy-config:
